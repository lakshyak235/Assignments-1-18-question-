<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Block and Inline Elements</title>
  <style>
    .box { border: 1px solid #555; margin: 8px 0; padding: 8px; }
  </style>
</head>
<body>
  <h1>Block and Inline Elements</h1>
  <div class="box">This is a block-level div element.</div>
  <p class="box">This paragraph is also a block element.</p>
  <p>
    Inline elements stay in the same line:
    <span style="color:red">span</span>,
    <strong>strong</strong>,
    <em>em</em>, and
    <a href="#example">anchor</a>.
  </p>
  <p id="example">The anchor above scrolls to this paragraph.</p>
</body>
</html>
