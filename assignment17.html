<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Form Validation</title>
</head>
<body>
  <h1>Registration Form</h1>
  <form method="post" action="submit.php">
    <p>
      <label for="name">Name:</label>
      <input type="text" id="name" name="name" required minlength="3" maxlength="40">
    </p>
    <p>
      <label for="email">Email:</label>
      <input type="email" id="email" name="email" required>
    </p>
    <p>
      <label for="mobile">Mobile Number:</label>
      <input type="tel" id="mobile" name="mobile" pattern="[0-9]{10}"
             minlength="10" maxlength="10" title="Enter exactly 10 digits" required>
    </p>
    <p>
      <label for="password">Password:</label>
      <input type="password" id="password" name="password"
             minlength="6" maxlength="20" required>
    </p>
    <p>
      <label for="age">Age:</label>
      <input type="number" id="age" name="age" min="18" max="30" required>
    </p>
    <button type="submit">Submit</button>
  </form>
</body>
</html>
