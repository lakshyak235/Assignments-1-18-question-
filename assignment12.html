<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Marks Table</title>
  <style>
    table { border-collapse: collapse; width: 400px; }
    th, td { border: 1px solid #333; padding: 8px; text-align: center; }
  </style>
</head>
<body>
  <table>
    <caption>Student Marks for Web Designing</caption>
    <thead>
      <tr>
        <th scope="col">Roll No.</th>
        <th scope="col">Name</th>
        <th scope="col">Marks</th>
      </tr>
    </thead>
    <tbody>
      <tr><td>1</td><td>Aarav</td><td>88</td></tr>
      <tr><td>2</td><td>Ananya</td><td>92</td></tr>
    </tbody>
    <tfoot>
      <tr><th scope="row" colspan="2">Average</th><td>90</td></tr>
    </tfoot>
  </table>
</body>
</html>
