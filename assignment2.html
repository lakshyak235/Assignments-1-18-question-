<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Text Formatting</title>
</head>
<body>
  <h1>Main Heading</h1>
  <h2>Subheading</h2>
  <p>This is a <b>bold</b> word, an <i>italic</i> word, and a <u>underlined</u> word.</p>
  <p>Water formula: H<sub>2</sub>O &nbsp; | &nbsp; Square: 5<sup>2</sup> = 25</p>
  <p><strong>Important:</strong> HTML uses entities such as &amp;, &lt;, &gt;, &quot;, &copy;, and &nbsp;.</p>
</body>
</html>
