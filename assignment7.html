<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Horizontal Navigation</title>
  <style>
    nav ul { list-style: none; margin: 0; padding: 0; background: #222; }
    nav li { display: inline-block; }
    nav a { display: block; color: white; padding: 12px 16px; text-decoration: none; }
    nav a:hover, nav a:focus { background: #555; }
  </style>
</head>
<body>
  <nav aria-label="Main navigation">
    <ul>
      <li><a href="#home">Home</a></li>
      <li><a href="#about">About</a></li>
      <li><a href="#courses">Courses</a></li>
      <li><a href="#contact">Contact</a></li>
    </ul>
  </nav>
  <main>
    <h1 id="home">Navigation Menu</h1>
  </main>
</body>
</html>
