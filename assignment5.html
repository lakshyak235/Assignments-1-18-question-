<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTML Lists</title>
</head>
<body>
  <h1>Three Types of Lists</h1>
  <h2>Unordered List</h2>
  <ul>
    <li>HTML</li>
    <li>CSS</li>
    <li>JavaScript</li>
  </ul>

  <h2>Ordered List</h2>
  <ol>
    <li>Create the HTML file.</li>
    <li>Add page content.</li>
    <li>Open the file in a browser.</li>
  </ol>

  <h2>Description List</h2>
  <dl>
    <dt>HTML</dt>
    <dd>Structures web page content.</dd>
    <dt>CSS</dt>
    <dd>Controls presentation and layout.</dd>
  </dl>
</body>
</html>
